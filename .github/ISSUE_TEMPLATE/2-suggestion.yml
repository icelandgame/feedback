name: 功能建議
description: 想要的新功能，或現有功能的改進
labels: ["建議"]
body:
  - type: markdown
    attributes:
      value: |
        先搜尋看看有沒有人提過一樣的建議。有的話，按 👍 或在底下補充就好。
  - type: dropdown
    id: area
    attributes:
      label: 哪一塊
      options:
        - 遊玩
        - 選歌、介面
        - 多人
        - 排行、成績
        - 製譜器
        - 網站
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 想要什麼
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 為什麼需要
      description: 現在遇到什麼不方便？有這個功能之後會怎麼用？
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: 其他補充
      description: 參考的遊戲、示意圖都可以
